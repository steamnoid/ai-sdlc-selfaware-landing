name: the page

# A page about what a workflow produced, which reads the six trackers this family runs on itself.
#
# **Nothing here clones anything and nothing here runs a test suite.** That is not a shortcut: the
# subject of this page is a tracker, and no working tree can be asked what is on one. It also makes
# this the most reliable page in the family — a collector that reads a sibling repository's files
# fails when somebody is halfway through an edit in that repository, which happened to the page
# this one is modelled on this afternoon.
#
# **Seventeen past the hour.** GitHub documents that a scheduled workflow can be delayed and that
# under load some queued jobs are dropped, and :00 is the minute everybody else asks for. What the
# schedule actually costs is measured rather than assumed, in `AGENTS.md`, from the runs that
# happened.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages keeps only the newest deployment, so a second run cancels the first rather than deploying
# out of order.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  THE_BRANCH: main
  THE_SITE: https://steamnoid.github.io/ai-sdlc-selfaware-landing
  THE_GITHUB_API: https://api.github.com

jobs:
  collect:
    name: Read the six trackers
    runs-on: ubuntu-latest
    # **The token Actions already mints, and not a secret anybody configured.** `github.token` is
    # available in every job without anything being created in the repository's settings, so this page
    # needs no setup — and it needs one, because the API allows sixty requests an hour to an
    # unauthenticated address and this makes about twenty of them. Sixty is also a limit per address,
    # and a runner's address is shared with whatever else GitHub is running there.
    permissions:
      contents: read
    outputs:
      has_changed: ${{ steps.changed.outputs.has_changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Read the six trackers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent collect

      - name: The collector's own tests, which reach no network
        run: npm run --silent test

      - name: Has anything changed on the page
        id: changed
        run: node scripts/what_differs_from_what_is_published.mjs --state src/state/the_family.json --moved src/state/what_moved.json

      - uses: actions/upload-artifact@v7
        with:
          name: the-state
          path: src/state
          retention-days: 7

  build:
    name: Build the page
    needs: collect
    # **The skip is right for a schedule and wrong for a person.** A schedule that finds the six
    # trackers exactly where it left them should not publish a byte-identical artefact. But
    # `workflow_dispatch` means somebody pressed a button, and refusing a request because nothing had
    # changed is not a skip — it is a green first stage and then silence, which is the hardest shape
    # of failure to notice. So a dispatch always builds.
    if: github.event_name == 'workflow_dispatch' || needs.collect.outputs.has_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: the-state
          path: src/state

      - run: npm ci

      - name: The page's tests, against the state that was read
        run: npm run --silent test

      - run: npm run --silent build

      - uses: actions/configure-pages@v6
        with:
          # Without this a repository that has never had a Pages site fails to configure, and the
          # first deployment is the one that discovers it.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5